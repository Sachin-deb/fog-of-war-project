<!doctype html><html><head><meta charset="utf-8"><title>Fog-of-War replay</title>
<style>
body{font-family:system-ui,sans-serif;background:#1b1d22;color:#e8e8e8;margin:0;padding:16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#9aa;margin-bottom:12px;font-size:14px}
.boards{display:flex;gap:18px;flex-wrap:wrap}
.card{background:#262a31;padding:10px;border-radius:8px}

.mv{outline:3px solid #ffd33d;outline-offset:-3px}

.p.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 2px #000}.p.b{color:#111}
.ctl{margin:14px 0;display:flex;gap:10px;align-items:center}

input[type=range]{width:300px}
#info{background:#262a31;padding:10px 14px;border-radius:8px;max-width:1000px;line-height:1.5;font-size:14px}
.tag{padding:1px 7px;border-radius:4px;font-size:12px}
</style></head><body>

function board(el,pieces,vis,mv,lost){
